name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches committed version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "tag v$TAG_VERSION != Cargo.toml $CRATE_VERSION — bump the manifest, then tag"; exit 1
          fi
      - run: cargo test --locked
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: cargo publish --locked
      - name: Verify by reading back
        run: |
          sleep 30
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sfL -A "tana-release-verify" "https://crates.io/api/v1/crates/stdio/$VERSION/download" -o /tmp/readback.crate
          tar tzf /tmp/readback.crate | head -3
