# Fixed filename: npm trusted publishing for @zegadb/stdio is bound to
# publish-npm.yml and the `release` environment. Do not rename or split it.
#
# Publishes the TypeScript package @zegadb/stdio from this repository.
# Triggered by pushing a tag npm-vX.Y.Z (stable: npm dist-tag latest) or
# npm-vX.Y.Z-<prerelease> (npm dist-tag next). The tag must equal the version in
# package.json and point at a commit on main. The crate on crates.io is a
# separate workflow (publish.yml), triggered by the plain tag vX.Y.Z; the two
# tag shapes never match each other's trigger.
#
# Same shape as zegadb/zega's publish-npm.yml: OIDC trusted publishing
# (id-token: write, no npm token secret), `release` environment, npm pinned for
# trusted publishing, a rerun skips what npm already has, and the result is read
# back from the registry.
name: publish-npm

on:
  push:
    tags:
      - 'npm-v*'

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'zegadb/stdio'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing, no npm token
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is on main and names the committed version
        id: release
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          TAG_VERSION="${GITHUB_REF_NAME#npm-v}"
          PKG_VERSION=$(jq -r .version package.json)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag npm-v$TAG_VERSION != package.json $PKG_VERSION: bump package.json, then tag"; exit 1
          fi
          jq -e '.name == "@zegadb/stdio"' package.json >/dev/null
          if [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          elif [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "::error::not a version: $PKG_VERSION"; exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      # Trusted publishing needs npm >= 11.5.1; pinned on purpose, as in
      # zegadb/zega and create-deka-app.
      - run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund

      - name: Build and test before anything is published
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run embed-font
          git diff --exit-code -- src/font.ts
          bun run typecheck
          bun run build
          bun test

      - name: Publish
        env:
          NPM_VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          set -euo pipefail
          if [ "$(npm view "@zegadb/stdio@${NPM_VERSION}" version 2>/dev/null || true)" = "$NPM_VERSION" ]; then
            echo "@zegadb/stdio@${NPM_VERSION} is already on npm; skipping."
          else
            npm publish --tag "$DIST_TAG" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org/
          fi

      - name: Verify by reading back
        env:
          NPM_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if [ "$(npm view "@zegadb/stdio@${NPM_VERSION}" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)" = "$NPM_VERSION" ]; then
              npm view "@zegadb/stdio@${NPM_VERSION}" name version dist.integrity --registry=https://registry.npmjs.org/
              exit 0
            fi
            sleep 10
          done
          echo "::error::@zegadb/stdio@${NPM_VERSION} is not on npm after publishing"; exit 1
