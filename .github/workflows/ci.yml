name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: fmt, clippy, and test
    runs-on: ubuntu-latest
    environment: public-ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  typescript:
    name: typescript build and test
    runs-on: ubuntu-latest
    environment: public-ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      # The committed src/font.ts is what terrace-font.flf generates.
      - run: bun run embed-font
      - run: git diff --exit-code -- src/font.ts
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
      # The package ships exactly: the compiled code, the font, README and LICENSE.
      - name: Package contents
        run: |
          set -euo pipefail
          npm pack --dry-run --json --ignore-scripts | jq -r '.[0].files[].path' | sort > packed.txt
          printf '%s\n' LICENSE README.md dist/font.d.ts dist/font.js dist/index.d.ts dist/index.js package.json src/terrace-font.flf | sort > expected.txt
          diff expected.txt packed.txt
